app-id: io.github.seinedkoda.kisel
sdk: org.kde.Sdk
runtime: org.kde.Platform
runtime-version: '6.11'
command: kisel
base: org.winehq.Wine # Contains 32-bit libs
base-version: stable-25.08

finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri # Hardware acceleration
  - --share=ipc # For Qt
  - --share=network
  - --socket=pulseaudio
  - --allow=bluetooth
  - --allow=multiarch # Enable 32-bit libs support
  - --allow=per-app-dev-shm # Shared memory
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher # Tray icon
  - --system-talk-name=org.freedesktop.UDisks2 # Mounted Devices
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --env=PATH=/app/bin:/usr/bin:/usr/lib/extensions/vulkan/MangoHud/bin:/usr/lib/extensions/vulkan/OBSVkCapture/bin
  - --filesystem=xdg-config/MangoHud:ro

inherit-extensions:
  - org.freedesktop.Platform.GL32
  - org.freedesktop.Platform.Compat.i386
  - org.freedesktop.Platform.codecs_extra.i386
  - org.freedesktop.Platform.VAAPI.Intel.i386

modules:
  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/i386-linux-gnu
      - mkdir -p /app/lib/debug/lib/i386-linux-gnu
      - mkdir -p /app/lib/i386-linux-gnu/GL
      - mkdir -p /app/lib/i386-linux-gnu/dri/intel-vaapi-driver
      - install -Dm644 ld.so.conf /app/etc/ld.so.conf
    sources:
      - type: inline
        dest-filename: ld.so.conf
        contents: |
          /app/lib32
          /app/lib/i386-linux-gnu
          /app/i386
          /usr/lib/x86_64-linux-gnu/dri/intel-vaapi-driver/lib/

  - name: icoutils
    buildsystem: simple
    build-commands:
      - ar x icoutils.deb
      - tar xf data.tar.*
      - cp -r usr/bin /app/
    sources:
      - type: file
        url: http://ftp.us.debian.org/debian/pool/main/i/icoutils/icoutils_0.32.3-6_amd64.deb
        sha256: 16a1b2b359ef3d90e9b83b8cf44ce58b11f097c023d02f3bf77745362a6f7247
        dest-filename: icoutils.deb

  - name: kisel
    buildsystem: cmake-ninja
    build-options:
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
